<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Home</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:#f4f6f9;
        }

        .container{
            width:80%;
            margin:40px auto;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        .profile-img{
            width:120px;
            height:120px;
            border-radius:50%;
            margin-bottom:15px;
            border:4px solid #4CAF50;
        }

        h1{
            color:#333;
        }

        h2{
            color:#4CAF50;
        }

        p{
            font-size:18px;
            color:#555;
        }

        .menu{
            margin-top:30px;
        }

        .menu a{
            display:inline-block;
            text-decoration:none;
            background:#4CAF50;
            color:white;
            padding:12px 20px;
            margin:10px;
            border-radius:8px;
            transition:0.3s;
            font-weight:bold;
        }

        .menu a:hover{
            background:#2e7d32;
            transform:scale(1.05);
        }

        .logout{
            background:#e53935 !important;
        }

        .logout:hover{
            background:#b71c1c !important;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <img src="https://via.placeholder.com/120"
                 class="profile-img">

            <h1>Welcome Home</h1>

            <h2>
                <span th:text="${session.user.name}"></span>
            </h2>

            <p>
                Email :
                <span th:text="${session.user.email}"></span>
            </p>

            <p>
                Role :
                <span th:text="${session.user.role}"></span>
            </p>

            <div class="menu">

                <a href="/jobs">
                    View Jobs
                </a>

                <a href="/appliedJobs"
                   th:if="${session.user.role == 'CANDIDATE'}">

                    Applied Jobs

                </a>

                <a href="/savedJobs"
                   th:if="${session.user.role == 'CANDIDATE'}">

                    Saved Jobs

                </a>

                <a href="/addJob"
                   th:if="${session.user.role == 'RECRUITER'}">

                    Post Job

                </a>

                <a href="/profile">
                    My Profile
                </a>

                <a href="/logout"
                   class="logout">

                    Logout

                </a>

            </div>

        </div>

    </div>

</body>

</html>
