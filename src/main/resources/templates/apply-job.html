<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Apply Job</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container{
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        form{
            display: flex;
            flex-direction: column;
        }

        label{
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus{
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        input[readonly]{
            background-color: #f1f1f1;
        }

        button{
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background-color: #2196f3;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Job Application</h2>

    <form th:action="@{/submit}"
          th:object="${applyJob}"
          method="post">

        <label>Name</label>
        <input type="text"
               th:field="*{candidateName}"
               placeholder="Enter Your Name"/>

        <label>Email</label>
        <input type="email"
               th:field="*{email}"
               placeholder="Enter Your Email"/>

        <label>Phone</label>
        <input type="text"
               th:field="*{phone}"
               placeholder="Enter Phone Number"/>

        <label>Graduation Year</label>
        <input type="number"
               th:field="*{graduationYear}"
               placeholder="Enter Graduation Year"/>

        <label>Field Of Study</label>
        <input type="text"
               th:field="*{fieldOfStudy}"
               placeholder="Ex: B.Tech CSE"/>

        <label>Resume Link</label>
        <input type="text"
               th:field="*{resume}"
               placeholder="Paste Resume Google Drive Link"/>

        <label>Job Title</label>
        <input type="text"
               th:field="*{jobTitle}"
               readonly />

        <label>Company</label>
        <input type="text"
               th:field="*{company}"
               readonly />

        <button type="submit">
            Submit Application
        </button>

    </form>

</div>

</body>
</html>
