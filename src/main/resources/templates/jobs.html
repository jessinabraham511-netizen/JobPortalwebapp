<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Jobs</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.heading{
    text-align:center;
    color:#333;
    margin-bottom:30px;
}

.job-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.job-card{
    background:white;
    width:320px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.job-card:hover{
    transform:translateY(-5px);
}

.job-title{
    font-size:22px;
    font-weight:bold;
    color:#222;
}

.company{
    color:#555;
    margin-top:5px;
}

.location{
    color:#777;
    margin-top:5px;
}

.description{
    margin-top:15px;
    line-height:1.5;
}

.apply-btn{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.apply-btn:hover{
    background:#1d4ed8;
}

.add-job{
    display:inline-block;
    margin-bottom:20px;
    background:green;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
}
.home-btn{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.home-btn:hover{
    background:#1d4ed8;
}

</style>
</head>

<body>

<h1 class="heading">Available Jobs</h1>

<a href="/addJob" class="add-job"
th:if="${session.user.role == 'RECRUITER'}">
Add Job
</a>

<div class="job-container">

<div class="job-card" th:each="job : ${jobs}">

    <div class="job-title"
    th:text="${job.title}">
    </div>

    <div class="company"
    th:text="${job.company}">
    </div>

    <div class="location"
    th:text="${job.location}">
    </div>

    <div class="description"
    th:text="${job.description}">
    </div>

    <form action="/apply"
    method="get"
    th:if="${session.user.role == 'CANDIDATE'}">

        <input type="hidden"
        name="id"
        th:value="${job.id}"/>

        <button type="submit"
        class="apply-btn">

            Apply Now

        </button>
		

    </form>
	<a th:href="@{/saveCandidateJob(id=${job.id})}">
	    <button class="save-btn">
	        Save Job
	    </button>
	</a>

</div>

</div>

<a href="/gotohome" class="home-btn"
th:if="${session.user.role == 'RECRUITER'}">
Go to Home
</a>

</body>
</html>
