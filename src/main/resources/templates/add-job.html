<body>

<div class="job-container">

    <a href="/jobs" class="back-btn">
        ← Back to Jobs
    </a>

    <div class="job-form">

        <h2>Post New Job</h2>

        <form th:action="@{/saveJob}"
              th:object="${job}"
              method="post">

            <label>Job Title</label>
            <input type="text"
                   th:field="*{title}"
                   placeholder="Enter job title">

            <label>Company</label>
            <input type="text"
                   th:field="*{company}"
                   placeholder="Enter company name">

            <label>Location</label>
            <input type="text"
                   th:field="*{location}"
                   placeholder="Enter location">

            <label>Description</label>
            <textarea th:field="*{description}"
                      placeholder="Enter job description"></textarea>

            <button type="submit">
                Post Job
            </button>
			
			<a href="/gotohome" class="home-btn"
			th:if="${session.user.role == 'RECRUITER'}">
			Go to Home
			</a>

        </form>

    </div>

</div>
