<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Job Portal</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        .container{
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        form{
            display: flex;
            flex-direction: column;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus{
            border-color: #4facfe;
            box-shadow: 0 0 5px rgba(79,172,254,0.5);
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4facfe;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background-color: #2196f3;
        }

        .error{
            color: red;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link{
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a{
            text-decoration: none;
            color: #2196f3;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Job Portal Login</h2>

        <form th:action="@{/login}" method="post" th:object="${user}">

            <input type="text"
                   th:field="*{email}"
                   placeholder="Enter Email"
                   required />

            <input type="password"
                   th:field="*{password}"
                   placeholder="Enter Password"
                   required />

            <button type="submit">Login</button>

        </form>

        <p class="error"
           th:if="${error}"
           th:text="${error}">
        </p>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

</body>
</html>
