<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Applied Jobs</title>

<style>

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:30px;
}

.heading{
    text-align:center;
    margin-bottom:30px;
}

.applied-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.applied-card{
    background:white;
    width:300px;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.job-title{
    font-size:22px;
    font-weight:bold;
}

.company{
    color:#555;
    margin-top:8px;
}

.status{
    margin-top:15px;
    display:inline-block;
    padding:8px 14px;
    border-radius:20px;
    background:#dbeafe;
    color:#1d4ed8;
    font-weight:bold;
}

</style>

</head>

<body>

<h1 class="heading">Applied Jobs</h1>

<div class="applied-container">

<div class="applied-card"
th:each="job : ${jobs}">

    <div class="job-title"
    th:text="${job.jobTitle}">
    </div>

    <div class="company"
    th:text="${job.company}">
    </div>

    <div class="status"
    th:text="${job.status}">
    </div>

</div>

</div>

</body>
</html>
